# Builds the bilingual book site (MkDocs Material) and publishes it on GitHub Pages.
# Links to repository files (tools/, examples/, suite/) point at GitHub.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the site tools
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7 mkdocs-static-i18n==1.3.1 pymdown-extensions==10.21.3 jieba==0.42.1
      - name: Build (strict)
        env:
          HANDBOOK_SOURCE_URL: https://github.com/training-alignment/training-alignment-handbook/blob/main
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
